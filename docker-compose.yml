services:
  inference:
    build:
      context: .
      dockerfile: Dockerfile.infer
      provenance: false
      sbom: false
    container_name: amazon-inference
    environment:
      - PORT=8001
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      provenance: false
      sbom: false
    container_name: amazon-web
    environment:
      - INFERENCE_URL=http://inference:8001
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped