<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ product['Title'] }} | Product Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header class="brand-bar text-center mb-4">
        <div class="container py-2">
            <h1 class="brand-title mb-2">Amazon Product Recommender</h1>
            <p class="brand-subtitle mb-0">Product detail view</p>
        </div>
    </header>

    <main class="container pb-5">
        <article class="details-card row g-4 align-items-center p-3 p-md-4">
            <div class="col-12 col-lg-5 text-center">
                <img src="{{ product['Image URL'] }}" alt="{{ product['Title'] }} image" class="product-img product-img-detail" loading="lazy">
            </div>
            <div class="col-12 col-lg-7">
                <p class="category-pill mb-2">{{ product['Category'] }}</p>
                <h2 class="detail-title mb-3">{{ product['Title'] }}</h2>
                <p class="price detail-price mb-3">₹{{ product['Price (INR)'] }}</p>
                {% if product['Description'] %}
                    <p class="detail-description mb-4">{{ product['Description'] }}</p>
                {% endif %}
                <div class="d-flex flex-wrap gap-2">
                    <a href="{{ product['Product Link'] }}" class="btn amazon-btn btn-lg" target="_blank" rel="noopener noreferrer">Buy on Amazon</a>
                    <a href="{{ url_for('home') }}" class="btn btn-outline-light amazon-outline btn-lg">Back to Search</a>
                </div>
            </div>
        </article>
    </main>

    <footer class="footer-bar text-center">
        <div class="container py-3">
            <span>&copy; 2026 Amazon Product Recommender</span>
        </div>
    </footer>
</body>
</html>
